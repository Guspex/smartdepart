[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '(\.venv|venv|__pycache__)'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
